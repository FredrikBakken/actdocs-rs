[package]
name = "actdocs-rs"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Generate documentation for GitHub Actions and reusable workflows"
license = "Apache-2.0"
repository = "https://github.com/FredrikBakken/actdocs-rs"
readme = "README.md"
keywords = ["github-actions", "documentation", "markdown"]
categories = ["command-line-utilities", "development-tools"]

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
saphyr = "0.0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"

[profile.release]
strip = true
