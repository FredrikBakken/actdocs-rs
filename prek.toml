[[repos]]
repo = "builtin"
hooks = [
    { id = "trailing-whitespace" },
    { id = "check-added-large-files" },
    { id = "check-case-conflict" },
    { id = "end-of-file-fixer" },
    { id = "fix-byte-order-marker" },
    { id = "forbid-new-submodules" },
    { id = "check-toml" },
    { id = "check-yaml" },
    { id = "mixed-line-ending" },
    { id = "check-symlinks" },
    { id = "check-merge-conflict" },
    { id = "detect-private-key" },
    { id = "no-commit-to-branch", args = ["--branch", "main"] },
    { id = "check-shebang-scripts-are-executable" },
    { id = "check-executables-have-shebangs" },
]

[[repos]]
repo = "local"
hooks = [
    # Both run over the whole crate rather than the changed files: rustfmt
    # needs the edition from Cargo.toml, and clippy is a whole-crate analysis
    # that cannot be scoped to a file list. The `files` pattern still decides
    # *whether* they run.
    {
        id = "cargo-fmt",
        name = "Format Rust",
        language = "system",
        entry = "cargo fmt --all",
        files = "\\.rs$",
        pass_filenames = false,
    },
    {
        id = "cargo-clippy",
        name = "Lint Rust",
        language = "system",
        entry = "cargo clippy --all-targets -- -D warnings",
        files = "\\.(rs|toml)$",
        pass_filenames = false,
    },
]

[[repos]]
repo = "https://github.com/rvben/rumdl-pre-commit"
rev = "v0.2.52"
hooks = [
    { id = "rumdl", args = ["--disable", "MD013"] },
    { id = "rumdl-fmt", args = ["--disable", "MD013"] },
]
