name: "Release"

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Releases must not race each other: two runs would compute the same next
# version and the second tag creation would fail.
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  version:
    name: "Compute version"
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.semver.outputs.version }}"
      version_tag: "${{ steps.semver.outputs.version_tag }}"
      release: "${{ steps.semver.outputs.version_type != 'none' && steps.semver.outputs.is_tagged == 'false' }}"
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The action derives the version from commit history since the last tag.
          fetch-depth: 0
          persist-credentials: false

      - name: "Compute semantic version"
        id: semver
        uses: PaulHatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373  # v6.0.3
        with:
          # The v6 defaults already match Conventional Commits. This additionally
          # picks up `BREAKING CHANGE:` footers, which live in the commit body
          # and are otherwise missed.
          search_commit_body: true

  release:
    name: "Tag and release"
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Created as a draft. An immutable release freezes its assets the moment
      # it is published, so every binary has to be attached first. The draft is
      # also the better failure mode: a build that dies leaves an unpublished
      # release rather than a published one missing half its platforms.
      #
      # The tag is created at --target when the draft is published, so there is
      # still no separate tag push and no need for persisted git credentials.
      - name: "Create draft release"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.version.outputs.version_tag }}"
        run: |
          gh release create "$TAG" \
            --draft \
            --target "$GITHUB_SHA" \
            --title "$TAG" \
            --generate-notes

  binaries:
    name: "Build ${{ matrix.target }}"
    needs:
      - version
      - release
    runs-on: "${{ matrix.runner }}"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
          # Cross-compiled from Apple Silicon: the macOS SDK is universal, so
          # this needs no cross toolchain. The free Intel runner (macos-13) has
          # been retired, and every remaining Intel label is a billed larger
          # runner — not worth it for a target the arm64 host can produce.
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4

      # Every leg now builds with an explicit --target, so the output path is
      # uniform whether or not the host matches. mise sets RUSTUP_TOOLCHAIN, so
      # this lands on the pinned toolchain rather than a default one.
      - name: "Add the target"
        env:
          TARGET: "${{ matrix.target }}"
        run: rustup target add "$TARGET"

      # Stamped, not committed: the tag is the source of truth for the version,
      # and committing back to main would retrigger this workflow. The effect is
      # limited to what `--version` prints.
      - name: "Stamp the version"
        env:
          VERSION: "${{ needs.version.outputs.version }}"
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -m1 '^version = ' Cargo.toml

      - name: "Build"
        env:
          TARGET: "${{ matrix.target }}"
        run: cargo build --release --target "$TARGET"

      - name: "Package"
        id: package
        env:
          TAG: "${{ needs.version.outputs.version_tag }}"
          TARGET: "${{ matrix.target }}"
        run: |
          # Git Bash on Windows ships neither sha256sum nor shasum, and macOS
          # ships only shasum. certutil is the one hashing tool always present
          # on a Windows runner. All three are normalised to a bare digest.
          digest() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1" | cut -d' ' -f1
            elif command -v shasum >/dev/null 2>&1; then
              shasum -a 256 "$1" | cut -d' ' -f1
            else
              certutil -hashfile "$1" SHA256 | sed -n 2p | tr -d '\r ' | tr 'A-Z' 'a-z'
            fi
          }

          name="actdocs-rs-${TAG}-${TARGET}"
          binary="actdocs-rs"
          [[ "$RUNNER_OS" == "Windows" ]] && binary="actdocs-rs.exe"

          mkdir -p "dist/$name"
          cp "target/${TARGET}/release/${binary}" "dist/$name/"
          cp LICENSE NOTICE README.md "dist/$name/"

          tar -czf "dist/${name}.tar.gz" -C dist "$name"

          # Three implementations means three chances to drift, so the shape of
          # the result is checked rather than trusted. Older certutil builds
          # print the digest as space-separated byte pairs, for instance.
          sum="$(digest "dist/${name}.tar.gz")"
          if [[ ! "$sum" =~ ^[0-9a-f]{64}$ ]]; then
            echo "unexpected digest for ${name}.tar.gz: $sum" >&2
            exit 1
          fi

          # Two columns, so the file works with `sha256sum -c` as downloaded.
          printf '%s  %s\n' "$sum" "${name}.tar.gz" > "dist/${name}.tar.gz.sha256"

          echo "archive=dist/${name}.tar.gz" >>"$GITHUB_OUTPUT"

      - name: "Upload to the release"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.version.outputs.version_tag }}"
          ARCHIVE: "${{ steps.package.outputs.archive }}"
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

  publish:
    name: "Publish release"
    needs:
      - version
      - binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Publishing is the step that makes the release immutable, so it goes last
      # and only once. `needs: binaries` waits for the whole matrix despite
      # fail-fast: false, so a single failed platform leaves the release a draft
      # — retryable, rather than permanently wrong.
      - name: "Publish"
        env:
          GH_TOKEN: "${{ github.token }}"
          # No checkout here, so gh has no git remote to infer the repo from.
          GH_REPO: "${{ github.repository }}"
          TAG: "${{ needs.version.outputs.version_tag }}"
        run: gh release edit "$TAG" --draft=false --latest


