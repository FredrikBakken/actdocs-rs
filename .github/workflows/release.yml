name: "Release"

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Releases must not race each other: two runs would compute the same next
# version and the second tag creation would fail.
concurrency:
  group: "${{ github.workflow }}"
  cancel-in-progress: false

jobs:
  version:
    name: "Compute version"
    runs-on: ubuntu-latest
    outputs:
      version: "${{ steps.semver.outputs.version }}"
      version_tag: "${{ steps.semver.outputs.version_tag }}"
      release: "${{ steps.semver.outputs.version_type != 'none' && steps.semver.outputs.is_tagged == 'false' }}"
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The action derives the version from commit history since the last tag.
          fetch-depth: 0
          persist-credentials: false

      - name: "Compute semantic version"
        id: semver
        uses: PaulHatch/semantic-version@502226b17e3e242e4befd0a45690fcbb27dd1373  # v6.0.3
        with:
          # The v6 defaults already match Conventional Commits. This additionally
          # picks up `BREAKING CHANGE:` footers, which live in the commit body
          # and are otherwise missed.
          search_commit_body: true

  release:
    name: "Tag and release"
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # `gh release create` creates the tag at --target itself, so there is no
      # separate tag push and no need for persisted git credentials.
      - name: "Create release"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.version.outputs.version_tag }}"
        run: gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes

  binaries:
    name: "Build ${{ matrix.label }}"
    needs:
      - version
      - release
    runs-on: "${{ matrix.runner }}"
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - label: aarch64-apple-darwin
            runner: macos-latest
          - label: x86_64-apple-darwin
            runner: macos-13
          - label: x86_64-pc-windows-msvc
            runner: windows-latest
    # Every runner builds for its own architecture, so no cross toolchain and no
    # `rustup target add` is needed; the label just names what came out.
    defaults:
      run:
        shell: bash
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4

      # Stamped, not committed: the tag is the source of truth for the version,
      # and committing back to main would retrigger this workflow. The effect is
      # limited to what `--version` prints.
      - name: "Stamp the version"
        env:
          VERSION: "${{ needs.version.outputs.version }}"
        run: |
          sed -i.bak "s/^version = \".*\"/version = \"$VERSION\"/" Cargo.toml
          rm Cargo.toml.bak
          grep -m1 '^version = ' Cargo.toml

      - name: "Build"
        run: cargo build --release

      - name: "Package"
        id: package
        env:
          TAG: "${{ needs.version.outputs.version_tag }}"
          LABEL: "${{ matrix.label }}"
        run: |
          name="actdocs-rs-${TAG}-${LABEL}"
          binary="actdocs-rs"
          [[ "$RUNNER_OS" == "Windows" ]] && binary="actdocs-rs.exe"

          mkdir -p "dist/$name"
          cp "target/release/$binary" "dist/$name/"
          cp LICENSE README.md "dist/$name/"

          tar -czf "dist/${name}.tar.gz" -C dist "$name"
          shasum -a 256 "dist/${name}.tar.gz" | awk '{print $1}' > "dist/${name}.tar.gz.sha256"

          echo "archive=dist/${name}.tar.gz" >>"$GITHUB_OUTPUT"

      - name: "Upload to the release"
        env:
          GH_TOKEN: "${{ github.token }}"
          TAG: "${{ needs.version.outputs.version_tag }}"
          ARCHIVE: "${{ steps.package.outputs.archive }}"
        run: gh release upload "$TAG" "$ARCHIVE" "$ARCHIVE.sha256" --clobber

