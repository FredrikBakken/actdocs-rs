name: "CI"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

# A force-push supersedes the run it interrupted, so there is no reason to pay
# for both.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pr-title:
    name: "Validate PR title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Inline rather than an action: the check is a single regex, and a
      # dependency here would have to be pinned and updated forever.
      - name: "Check Conventional Commits format"
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          TYPES: "feat,fix,docs,style,refactor,test,chore"
          MAX_LENGTH: "72"
        run: |
          types_pattern="${TYPES//,/|}"
          regex="^($types_pattern)(\([a-zA-Z0-9_/-]+\))?!?: .{1,${MAX_LENGTH}}$"

          # NOTE: $regex must stay unquoted — quoting makes bash match literally.
          if [[ "$PR_TITLE" =~ $regex ]]; then
            echo "Pull request title follows the Conventional Commits standard."
            exit 0
          fi

          echo "Format: type(scope): description  ('!' before ':' marks a breaking change)"
          echo "Examples: 'feat(parse): support anchors' or 'refactor(cli)!: rename sync'"
          echo "Valid types: $TYPES"
          echo "More information: https://www.conventionalcommits.org/en/v1.0.0/"
          echo "::error::Pull request title does not follow the Conventional Commits standard: $PR_TITLE"
          exit 1

  hooks:
    name: "Run hooks"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4

      - name: "Cache hook environments"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: "${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}"
          restore-keys: "${{ runner.os }}-prek-"

      - name: "Cache cargo"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}"
          restore-keys: "${{ runner.os }}-cargo-"

      - name: "Run hooks"
        env:
          # The branch guard is for humans committing locally. CI checks out a
          # detached HEAD, but workflow_dispatch on main would trip it.
          SKIP: "no-commit-to-branch"
        run: prek run --all-files

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654  # v4.2.4

      - name: "Cache cargo"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}"
          restore-keys: "${{ runner.os }}-cargo-test-"

      - name: "Run tests"
        run: cargo test --locked
