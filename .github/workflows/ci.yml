name: "CI"

on:
  pull_request:
    types: [opened, reopened, synchronize, edited]
  workflow_dispatch:

permissions:
  contents: read

# A force-push supersedes the run it interrupted, so there is no reason to pay
# for both.
concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  pr-title:
    name: "Validate PR title"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      # Inline rather than an action: the check is a single regex, and a
      # dependency here would have to be pinned and updated forever.
      - name: "Check Conventional Commits format"
        env:
          PR_TITLE: "${{ github.event.pull_request.title }}"
          TYPES: "feat,fix,docs,style,refactor,test,chore"
          MAX_LENGTH: "72"
        run: |
          types_pattern="${TYPES//,/|}"
          regex="^($types_pattern)(\([a-zA-Z0-9_/-]+\))?!?: .{1,${MAX_LENGTH}}$"

          # NOTE: $regex must stay unquoted — quoting makes bash match literally.
          if [[ "$PR_TITLE" =~ $regex ]]; then
            echo "Pull request title follows the Conventional Commits standard."
            exit 0
          fi

          echo "Format: type(scope): description  ('!' before ':' marks a breaking change)"
          echo "Examples: 'feat(parse): support anchors' or 'refactor(cli)!: rename sync'"
          echo "Valid types: $TYPES"
          echo "More information: https://www.conventionalcommits.org/en/v1.0.0/"
          echo "::error::Pull request title does not follow the Conventional Commits standard: $PR_TITLE"
          exit 1

  hooks:
    name: "Run hooks"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5

      - name: "Cache hook environments"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: "${{ runner.os }}-prek-${{ hashFiles('prek.toml') }}"
          restore-keys: "${{ runner.os }}-prek-"

      - name: "Cache cargo"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}"
          restore-keys: "${{ runner.os }}-cargo-"

      - name: "Run hooks"
        env:
          # The branch guard is for humans committing locally. CI checks out a
          # detached HEAD, but workflow_dispatch on main would trip it.
          SKIP: "no-commit-to-branch"
        run: prek run --all-files

  test:
    name: "Test"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5

      - name: "Cache cargo"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: "${{ runner.os }}-cargo-test-${{ hashFiles('Cargo.lock') }}"
          restore-keys: "${{ runner.os }}-cargo-test-"

      - name: "Run tests"
        run: cargo test --locked

  hook:
    name: "Self-test the hook definition"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The consumer clones this repository to install the hook, so the
          # commit has to be reachable in it, not merely checked out.
          fetch-depth: 0
          persist-credentials: false

      - name: "Install pinned tools"
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518  # v4.2.5

      # Any source change invalidates the build, which is correct. The point of
      # restore-keys here is the managed Rust toolchain underneath it, which
      # does not change and is the slow part of a cold run.
      - name: "Cache the hook environment"
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/prek
          key: "${{ runner.os }}-prek-hook-${{ hashFiles('Cargo.lock', 'src/**', '.pre-commit-hooks.yaml') }}"
          restore-keys: "${{ runner.os }}-prek-hook-"

      # A repository that looks like a consumer, built from nothing so that the
      # test exercises the published contract rather than this checkout.
      - name: "Build a consumer repository"
        run: |
          consumer="$(mktemp -d)"
          echo "CONSUMER=$consumer" >>"$GITHUB_ENV"
          mkdir -p "$consumer/.github/actions/greet"

          cat >"$consumer/.github/actions/greet/action.yml" <<'YAML'
          name: Greet
          description: Say hello.
          inputs:
            who:
              description: Who to greet.
              required: true
            punctuation:
              description: How to end it.
              default: "!"
          outputs:
            greeting:
              description: What was said.
          runs:
            using: composite
            steps:
              - run: echo "hello"
                shell: bash
          YAML

          printf '# Consumer\n\n<!-- index start -->\n<!-- index end -->\n' \
            >"$consumer/README.md"

          # Pinned to this commit rather than to a branch, so the test covers
          # what the pull request contains and not whatever main has drifted to.
          rev="$(git -C "$GITHUB_WORKSPACE" rev-parse HEAD)"
          cat >"$consumer/.pre-commit-config.yaml" <<YAML
          repos:
            - repo: $GITHUB_WORKSPACE
              rev: $rev
              hooks:
                - id: actdocs
                  args: ["--docs-dir-target", "docs", "--index-target", "README.md"]
                - id: actdocs-check
          YAML

          git -C "$consumer" init --quiet
          git -C "$consumer" add -A
          git -C "$consumer" -c user.email=ci@example.com -c user.name=CI \
            commit --quiet -m "Initial"

      # The first run writes files, so a hook runner reports a modification and
      # exits non-zero. That is the expected outcome, not a failure.
      - name: "Run the hooks"
        working-directory: "${{ env.CONSUMER }}"
        run: prek run --all-files || true

      - name: "Check what the consumer got"
        working-directory: "${{ env.CONSUMER }}"
        run: |
          fail() { echo "::error::$1"; exit 1; }

          beside=".github/actions/greet/README.md"
          [[ -f "$beside" ]] || fail "no document beside the manifest"
          grep -q '^# greet$' "$beside" || fail "$beside is not titled after its directory"
          grep -q '| who |' "$beside" || fail "$beside is missing its inputs"
          grep -q 'uses: <owner>/<repo>/.github/actions/greet@' "$beside" \
            || fail "$beside is missing its usage snippet"

          mirrored="docs/actions/greet.md"
          [[ -f "$mirrored" ]] || fail "--docs-dir-target wrote nothing"
          grep -q 'Generated from' "$mirrored" || fail "$mirrored does not link back"

          grep -q '\[`greet`\](.github/actions/greet/README.md)' README.md \
            || fail "--index-target did not list the action"

      # Idempotence through the hook, which is the property a consumer actually
      # relies on: a second commit must not produce a diff.
      - name: "Check that a second run is a no-op"
        working-directory: "${{ env.CONSUMER }}"
        run: |
          git add -A
          git -c user.email=ci@example.com -c user.name=CI \
            commit --quiet -m "Generated"

          prek run --all-files
          git diff --quiet || {
            git diff
            echo "::error::a second run changed files"
            exit 1
          }
